<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="card">
    <img src="assets/1ae4309c-b551-4dcd-ac37-010c9f5979de.png" alt="Company logo" class="logo">
    <form>
      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@gmail.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter 6-digit password" minlength="6" required>

      <button type="submit">Create account</button>
    </form>

    <a href="index.html" class="create">Already have an account? Login</a>
  </div>
</body>
</html>
